<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>a-deric :: ANONYMOUS MARKETPLACE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://static.moonpay.com/web-sdk/v1/moonpay-web-sdk.min.js"></script>
  <style>
    /* ========== Original a-deric Retro UI (complete) ========== */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap');
    :root {
      --void: #0a0a0a; --panel: #0f0f0f; --text: #e0e0e0; --muted: #9e9e9e;
      --neon-green: #0f0; --neon-cyan: #0ff; --neon-magenta: #f0f; --neon-yellow: #ff0;
      --danger: #ff5555; --mono: 'Share Tech Mono', monospace; --disp: 'Press Start 2P', cursive;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; height: 100dvh; width: 100%; overflow: hidden; }
    body {
      background: var(--void); color: var(--text); font-family: var(--mono);
      -webkit-tap-highlight-color: transparent; user-select: none;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.03) 2px, rgba(0,255,0,0.03) 4px);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--void); }
    ::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 2px; }

    /* Login */
    #loginScreen { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: min(420px, 92vw); background: var(--panel); border: 1px solid var(--neon-cyan); padding: 32px 24px; box-shadow: 0 0 12px rgba(0,255,255,0.3); }
    .brand { font-family: var(--disp); font-size: 20px; color: #000; background: var(--neon-cyan); display: inline-block; padding: 6px 16px; border-radius: 3px; box-shadow: 0 0 15px var(--neon-cyan); text-transform: uppercase; margin-bottom: 8px; }
    .sub { text-align: center; color: var(--neon-green); font-size: 11px; margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; color: var(--neon-magenta); margin-bottom: 6px; text-transform: uppercase; }
    .field input[type=text], .field input[type=email], .field input[type=password], .field input[type=number], .field textarea, .field select {
      width: 100%; background: #000; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 12px; font-family: var(--mono); font-size: 14px; outline: none;
    }
    .color-row { display: flex; align-items: center; gap: 10px; }
    .color-row input[type=color] { width: 44px; height: 38px; border: 1px solid var(--neon-green); background: #000; }
    .btn { width: 100%; padding: 12px; background: var(--neon-green); color: #000; border: none; font-family: var(--mono); font-weight: bold; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; border-radius: 2px; box-shadow: 0 0 10px var(--neon-green); }
    .btn-ghost { background: transparent; color: var(--neon-magenta); border: 1px solid var(--neon-magenta); box-shadow: 0 0 6px rgba(255,0,255,0.3); }
    .divider { display: flex; align-items: center; gap: 10px; margin: 24px 0 16px; color: var(--neon-yellow); font-size: 10px; }
    .divider::before, .divider::after { content:""; flex:1; height:1px; background: var(--neon-yellow); }
    #adminFields { display: none; margin-top: 12px; }
    .error-msg { color: var(--danger); font-size: 11px; margin-top: 8px; text-align: center; min-height: 16px; }

    /* App */
    #appScreen { display: none; height: 100%; flex-direction: column; }
    .tabs { display: flex; border-bottom: 2px solid var(--neon-cyan); background: #000; flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 12px; background: transparent; color: var(--neon-green); border: none; font-family: var(--mono); font-size: 13px; cursor: pointer; text-transform: uppercase; }
    .tab-btn.active { background: var(--neon-green); color: #000; box-shadow: 0 0 12px var(--neon-green); }
    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }

    /* Chat */
    #chatTab { height: 100%; }
    .chat-layout { display: grid; grid-template-columns: 1fr 280px; height: 100%; }
    .chat-main { display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--neon-cyan); min-width: 0; }
    .chat-topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--neon-green); background: #000; flex-shrink: 0; }
    .chat-topbar .brand { font-size: 14px; margin: 0; background: var(--neon-green); color: #000; padding: 4px 12px; }
    .chat-topbar .who { font-size: 11px; color: var(--muted); }
    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #050505; }
    .msg { max-width: 82%; animation: rise 0.2s ease; }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } }
    .msg .bubble { background: #111; border: 1px solid var(--neon-cyan); padding: 10px 12px; font-size: 13px; line-height: 1.5; word-break: break-word; border-radius: 4px; color: var(--text); }
    .msg.mine .bubble { background: #0a1a0a; border-color: var(--neon-green); }
    .msg.system .bubble { border: 1px dashed var(--neon-yellow); color: var(--neon-yellow); font-size: 11px; text-align: center; }
    .composer { display: flex; gap: 8px; padding: 10px 12px; padding-bottom: calc(10px + var(--safe-bottom)); border-top: 1px solid var(--neon-green); background: #000; flex-shrink: 0; }
    .composer input[type=text] { flex: 1; background: #000; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px 12px; font-family: var(--mono); border-radius: 20px; }
    .composer button { background: var(--neon-green); color: #000; border: none; padding: 0 20px; border-radius: 20px; font-family: var(--mono); cursor: pointer; }
    .chat-sidebar { display: flex; flex-direction: column; background: #0a0a0a; border-left: 1px solid var(--neon-magenta); }
    .sidebar-head { padding: 12px; border-bottom: 1px solid var(--neon-cyan); display: flex; justify-content: space-between; }
    .online-list { flex: 1; overflow-y: auto; padding: 10px; }
    .online-item { display: flex; align-items: center; padding: 8px; border: 1px solid var(--neon-green); margin-bottom: 6px; background: #000; }
    .online-dot { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px var(--neon-green); }

    /* Market / Orders */
    #marketTab, #ordersTab { padding: 12px; overflow-y: auto; }
    .market-header { display: flex; gap: 10px; margin-bottom: 10px; }
    .market-header input { flex: 1; background: #000; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px; }
    .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .listing-card { background: var(--panel); border: 1px solid var(--neon-green); padding: 12px; cursor: pointer; transition: 0.2s; }
    .listing-card:hover { box-shadow: 0 0 12px var(--neon-green); }
    .listing-card img { width: 100%; max-height: 140px; object-fit: cover; border: 1px solid var(--neon-magenta); margin-bottom: 8px; }
    .listing-card h3 { font-size: 14px; color: var(--neon-yellow); margin-bottom: 4px; }
    .listing-card .price { font-size: 13px; color: var(--neon-cyan); font-weight: bold; }
    .order-card { background: var(--panel); border: 1px solid var(--neon-cyan); padding: 12px; margin-bottom: 12px; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--panel); border: 2px solid var(--neon-cyan); padding: 20px; width: min(500px, 90vw); max-height: 80vh; overflow-y: auto; }

    /* Mobile sidebar */
    #sidebarOverlay { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.7); z-index:2000; }
    #sidebarOverlay.active { display: block; }
    #mobileSidebar { position: fixed; top:0; right:0; width:min(300px,85vw); height:100%; background: #0a0a0a; z-index:2001; transform: translateX(100%); transition: transform 0.3s; display: flex; flex-direction: column; border-left: 1px solid var(--neon-magenta); }
    #mobileSidebar.active { transform: translateX(0); }
    #mobileSidebarToggle { display: none; }
    @media(max-width:768px) { .chat-layout { grid-template-columns: 1fr; } .chat-sidebar { display: none; } #mobileSidebarToggle { display: inline-flex; } #sidebarOverlay { display: block; } }
  </style>
</head>
<body>
<!-- Login -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">a-deric</div>
    <div class="sub">Anonymous Secure Terminal</div>
    <div class="field"><label>Identifier</label><input type="text" id="userName" placeholder="alias" maxlength="18"></div>
    <div class="field"><label>Color</label><div class="color-row"><input type="color" id="userColor" value="#00ff00"><span style="color:#0f0;">your color</span></div></div>
    <button class="btn" onclick="enterAsGuest()">ENTER CHAT →</button>
    <div class="error-msg" id="guestError"></div>
    <div class="divider">ADMIN ACCESS</div>
    <button class="btn-ghost" onclick="toggleAdminFields()">Admin Login</button>
    <div id="adminFields">
      <div class="field"><label>Email</label><input type="email" id="adminEmail"></div>
      <div class="field"><label>Password</label><input type="password" id="adminPassword"></div>
      <button class="btn" style="background:var(--neon-magenta);" onclick="adminLogin()">AUTHENTICATE</button>
      <div class="error-msg" id="adminError"></div>
    </div>
  </div>
</div>

<!-- App -->
<div id="appScreen">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">💬 Chat</button>
    <button class="tab-btn" onclick="switchTab('market')">🛒 Market</button>
    <button class="tab-btn" onclick="switchTab('orders')">📦 Orders</button>
  </div>

  <!-- Chat Tab -->
  <div id="chatTab" class="tab-content active">
    <div class="chat-layout">
      <div class="chat-main">
        <header class="chat-topbar">
          <div class="brand">a-deric</div>
          <div class="who">logged as <b id="meLabel"></b></div>
          <div style="display:flex;gap:6px;"><button id="mobileSidebarToggle" onclick="openMobileSidebar()">☰</button><button onclick="logout()">DISCONNECT</button></div>
        </header>
        <div id="messages"></div>
        <div id="typingIndicator" style="height:20px; padding:0 12px; font-size:11px; color:var(--neon-magenta);"></div>
        <div id="replyPreview" style="display:none; padding:8px 12px; border-top:1px solid var(--neon-cyan); background:var(--panel);"><span id="replyPreviewText"></span><button onclick="cancelReply()">✕</button></div>
        <div class="composer">
          <label style="border:1px solid var(--neon-magenta); padding:0 14px; border-radius:20px; cursor:pointer;">📎<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="uploadImage(event)"></label>
          <input type="text" id="msgInput" placeholder="type a message..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()">SEND</button>
        </div>
      </div>
      <div class="chat-sidebar">
        <div class="sidebar-head"><h3 style="font-size:11px; color:var(--neon-cyan);">Online</h3><button id="aubaBtn" onclick="toggleAUBA()" style="display:none;">AUBA</button></div>
        <div class="online-list" id="onlineList"></div>
        <div style="padding:10px; border-top:1px solid var(--neon-cyan);"><button id="broadcastBtn" onmousedown="startBroadcast()" onmouseup="stopBroadcast()" style="display:none;">🎤 VOICE</button></div>
        <div style="font-size:10px; color:var(--dim); padding:8px 12px; border-top:1px solid var(--neon-green);">Hold mic to transmit.</div>
      </div>
    </div>
  </div>

  <!-- Market Tab -->
  <div id="marketTab" class="tab-content">
    <div class="market-header">
      <input type="text" id="searchInput" placeholder="Search..." oninput="loadListings()">
      <button class="btn" onclick="showCreateListing()">+ New</button>
      <button class="btn" id="moonpayBtn" onclick="openMoonPay()" disabled>💳 Buy Crypto</button>
    </div>
    <div class="listing-grid" id="listingGrid"></div>
  </div>

  <!-- Orders Tab -->
  <div id="ordersTab" class="tab-content">
    <div id="ordersList"></div>
  </div>
</div>

<!-- Modals (full content) -->
<div class="modal-overlay" id="createListingModal">
  <div class="modal">
    <h2>Create Listing</h2>
    <div class="field"><label>Title</label><input type="text" id="lTitle" maxlength="60"></div>
    <div class="field"><label>Description</label><textarea id="lDesc" rows="3"></textarea></div>
    <div class="field"><label>Price</label><input type="number" id="lPrice" step="any"></div>
    <div class="field"><label>Currency</label><select id="lCurrency"><option>USDT</option><option>ETH</option><option>BTC</option></select></div>
    <div class="field"><label>Images</label><input type="file" id="lImages" accept="image/*" multiple onchange="previewListingImages()"></div>
    <div id="imgPreview" style="display:flex;gap:6px;margin-bottom:10px;"></div>
    <button class="btn" onclick="createListing()">Publish</button>
    <button class="btn" onclick="closeModal('createListingModal')">Cancel</button>
  </div>
</div>
<div class="modal-overlay" id="listingDetailModal"><div class="modal" id="listingDetailContent"></div></div>
<div class="modal-overlay" id="ratingModal">
  <div class="modal">
    <h2>Rate Seller</h2>
    <p>Order: <span id="rateOrderId"></span></p>
    <div class="field"><label>Rating (1-5)</label><input type="number" id="rateValue" min="1" max="5"></div>
    <div class="field"><label>Comment</label><textarea id="rateComment"></textarea></div>
    <button class="btn" onclick="submitRating()">Submit</button>
    <button class="btn" onclick="closeModal('ratingModal')">Cancel</button>
  </div>
</div>
<div class="modal-overlay" id="disputeModal">
  <div class="modal">
    <h2>Raise Dispute</h2>
    <p>Order: <span id="disputeOrderId"></span></p>
    <div class="field"><label>Reason</label><textarea id="disputeReason"></textarea></div>
    <button class="btn" onclick="submitDispute()">Submit</button>
    <button class="btn" onclick="closeModal('disputeModal')">Cancel</button>
  </div>
</div>

<!-- Mobile Sidebar -->
<div id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
<div id="mobileSidebar">
  <div class="sidebar-head"><h3 style="font-size:11px; color:var(--neon-cyan);">Online</h3><button onclick="closeMobileSidebar()">✕</button></div>
  <div class="online-list" id="onlineListMobile"></div>
  <div style="padding:10px;"><button id="broadcastBtnMobile" onmousedown="startBroadcast()" onmouseup="stopBroadcast()">🎤 VOICE</button></div>
</div>

<audio id="voicePlayer" style="display:none"></audio>

<script>
// CONFIG
const SUPABASE_URL = "https://uhvnsnmgbnwvougiuien.supabase.co";
const SUPABASE_KEY = "sb_publishable_IG8fjNc529oqgMaJqjpKcg_KtZt609p";
const GROQ_API_KEY = "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";
const MOONPAY_API_KEY = "";

let db;
db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = { name: "", color: "#0f0", isAdmin: false };
let currentTab = 'chat';
let replyTarget = null;
let presenceChannel, messagesChannel, controlChannel;
let othersTyping = {};

// ==================== LOGIN ====================
function enterAsGuest() {
  const name = document.getElementById('userName').value.trim();
  const color = document.getElementById('userColor').value;
  if (!name || name.toLowerCase()==='system') { document.getElementById('guestError').textContent='Invalid name.'; return; }
  me = { name, color, isAdmin: false };
  startApp();
}
async function adminLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if(error) { document.getElementById('adminError').textContent='Auth failed.'; return; }
  me = { name: data.user.user_metadata?.display_name || email.split('@')[0], color: '#0f0', isAdmin: true };
  startApp();
}
function toggleAdminFields() {
  document.getElementById('adminFields').style.display = document.getElementById('adminFields').style.display === 'block' ? 'none' : 'block';
}
function logout() { location.reload(); }

// ==================== START APP ====================
function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  document.getElementById('meLabel').textContent = me.name + (me.isAdmin ? " [ADMIN]" : "");
  if(me.isAdmin) {
    document.getElementById('aubaBtn').style.display = 'inline-block';
    document.getElementById('broadcastBtn').style.display = 'block';
    document.getElementById('broadcastBtnMobile').style.display = 'block';
  }
  if(MOONPAY_API_KEY) document.getElementById('moonpayBtn').disabled = false;
  initRealtime();
  loadChatHistory();
  switchTab('chat');
}

// ==================== TABS ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if(tab === 'chat') {
    document.getElementById('chatTab').classList.add('active');
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
  } else if(tab === 'market') {
    document.getElementById('marketTab').classList.add('active');
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    loadListings();
  } else if(tab === 'orders') {
    document.getElementById('ordersTab').classList.add('active');
    document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
    loadOrders();
  }
}

// ==================== MOBILE SIDEBAR ====================
function openMobileSidebar() {
  document.getElementById('sidebarOverlay').classList.add('active');
  document.getElementById('mobileSidebar').classList.add('active');
  document.getElementById('onlineListMobile').innerHTML = document.getElementById('onlineList').innerHTML;
}
function closeMobileSidebar() {
  document.getElementById('sidebarOverlay').classList.remove('active');
  document.getElementById('mobileSidebar').classList.remove('active');
}

// ==================== CHAT (FULL ORIGINAL) ====================
async function loadChatHistory() {
  const { data } = await db.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
  document.getElementById('messages').innerHTML = '';
  (data || []).forEach(renderMessage);
  scrollToBottom();
}

function subscribeToMessages() {
  messagesChannel = db.channel('messages-stream')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, payload => {
      renderMessage(payload.new); scrollToBottom();
    }).subscribe();
}

function renderMessage(row) {
  if(row.pm_target && row.username !== me.name && row.pm_target !== me.name) return;
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (row.username===me.name ? ' mine' : '') + (row.pm_target ? ' pm' : '') + (row.is_system ? ' system' : '');
  let imgHtml = row.image_url ? `<img src="${row.image_url}" style="max-width:150px;">` : '';
  if(row.is_system) {
    wrap.innerHTML = `<div class="bubble">${escapeHtml(row.text)}</div>`;
    document.getElementById('messages').appendChild(wrap);
    setTimeout(() => wrap.remove(), 10000);
    return;
  }
  wrap.innerHTML = `<div class="bubble">${escapeHtml(row.text || '')}${imgHtml}</div>`;
  document.getElementById('messages').appendChild(wrap);
}

function scrollToBottom() { const el = document.getElementById('messages'); if(el) el.scrollTop = el.scrollHeight; }

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const usedReply = replyTarget;
  cancelReply();
  if(text.startsWith('.bot ')) {
    const q = text.slice(5).trim();
    insertMessage({ text, reply: usedReply });
    askZectoBot(q);
    return;
  }
  const pmMatch = text.match(/^\[PM:([^\]]+)\]\s*(.*)$/i);
  if(pmMatch) {
    insertMessage({ text: `[PM] ${pmMatch[2].trim()}`, pm_target: pmMatch[1].trim(), reply: usedReply });
    return;
  }
  insertMessage({ text, reply: usedReply });
}

async function insertMessage({ text, image_url = null, pm_target = null, is_system = false, reply = null }) {
  await db.from('messages').insert({
    username: me.name, color: me.color, text, image_url, pm_target, is_system,
    reply_to_id: reply?.id, reply_to_name: reply?.name, reply_to_text: reply?.text
  });
}

async function askZectoBot(q) {
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+GROQ_API_KEY },
      body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: [{ role: 'system', content: 'You are a-deric AI.' }, { role: 'user', content: q }], max_tokens: 400 })
    });
    const data = await res.json();
    const answer = data?.choices?.[0]?.message?.content || 'error.';
    await insertMessage({ text: answer, is_bot: true });
  } catch(e) { await insertMessage({ text: '⚠ Bot offline.', is_bot: true }); }
}

async function uploadImage(evt) {
  const file = evt.target.files[0];
  if(!file) return;
  const path = `chat/${Date.now()}_${me.name}.${file.name.split('.').pop()}`;
  const { error } = await db.storage.from('chat-images').upload(path, file);
  if(error) { alert('Upload failed'); evt.target.value=''; return; }
  const { data } = db.storage.from('chat-images').getPublicUrl(path);
  await insertMessage({ text: '', image_url: data.publicUrl });
  evt.target.value = '';
}

function setReply(id, name, text) { replyTarget = { id, name, text }; document.getElementById('replyPreview').style.display='flex'; }
function cancelReply() { replyTarget = null; document.getElementById('replyPreview').style.display='none'; }

// Presence
function subscribeToPresence() {
  presenceChannel = db.channel('online-board', { config: { presence: { key: me.name } } });
  presenceChannel.on('presence', { event: 'sync' }, () => {
    let html = '';
    Object.values(presenceChannel.presenceState()).forEach(arr => arr.forEach(p => {
      html += `<div class="online-item"><span class="online-dot"></span>${escapeHtml(p.name)} ${p.isAdmin?'★':''}</div>`;
    }));
    document.getElementById('onlineList').innerHTML = html || '<div style="color:#666;">no one online</div>';
    document.getElementById('onlineListMobile').innerHTML = document.getElementById('onlineList').innerHTML;
  }).subscribe();
}

function initRealtime() {
  subscribeToMessages();
  subscribeToPresence();
}

// ==================== MARKETPLACE (FULL) ====================
async function loadListings() {
  const search = document.getElementById('searchInput')?.value || '';
  let query = db.from('listings').select('*, ratings(rating)').eq('status','active').order('created_at',{ascending:false});
  if(search) query = query.ilike('title', `%${search}%`);
  const { data } = await query;
  renderListings(data || []);
}
function renderListings(listings) {
  const grid = document.getElementById('listingGrid');
  if(!listings.length) { grid.innerHTML = '<p style="color:#666;">No listings.</p>'; return; }
  grid.innerHTML = listings.map(l => `
    <div class="listing-card" onclick="showListingDetail('${l.id}')">
      ${l.images?.length ? `<img src="${l.images[0]}" alt="">` : ''}
      <h3>${escapeHtml(l.title)}</h3>
      <p class="price">${l.price_crypto} ${l.crypto_currency}</p>
      <small style="color:#0f0;">${l.seller_username}</small>
    </div>
  `).join('');
}
function showCreateListing() { document.getElementById('createListingModal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
async function createListing() {
  const title = document.getElementById('lTitle').value.trim();
  const desc = document.getElementById('lDesc').value.trim();
  const price = parseFloat(document.getElementById('lPrice').value);
  const currency = document.getElementById('lCurrency').value;
  const files = document.getElementById('lImages').files;
  if(!title || isNaN(price)) return alert('Title and price required.');
  let imageUrls = [];
  for(let i = 0; i < Math.min(files.length, 3); i++) {
    const file = files[i];
    const path = `public/${Date.now()}_${me.name}_${i}.${file.name.split('.').pop()}`;
    const { error } = await db.storage.from('listing-images').upload(path, file);
    if(!error) {
      const { data } = db.storage.from('listing-images').getPublicUrl(path);
      imageUrls.push(data.publicUrl);
    }
  }
  await db.from('listings').insert({ seller_username: me.name, title, description: desc, price_crypto: price, crypto_currency: currency, images: imageUrls });
  closeModal('createListingModal');
  loadListings();
  document.getElementById('lTitle').value=''; document.getElementById('lDesc').value=''; document.getElementById('lPrice').value=''; document.getElementById('lImages').value=''; document.getElementById('imgPreview').innerHTML='';
}
async function showListingDetail(id) {
  const { data } = await db.from('listings').select('*, ratings(rating)').eq('id', id).single();
  if(!data) return;
  const avg = data.ratings?.length ? (data.ratings.reduce((a,b)=>a+b.rating,0)/data.ratings.length).toFixed(1) : 'No ratings';
  document.getElementById('listingDetailContent').innerHTML = `
    <h2>${escapeHtml(data.title)}</h2>
    ${data.images?.map(u => `<img src="${u}" style="max-width:200px;display:block;margin:6px 0;">`).join('')}
    <p>${escapeHtml(data.description)}</p>
    <p class="price">${data.price_crypto} ${data.crypto_currency}</p>
    <p>Seller: <b>${escapeHtml(data.seller_username)}</b> | ${avg} ★</p>
    <button class="btn" onclick="buyListing('${data.id}')">Buy Now</button>
    ${me.isAdmin ? `<button class="btn" style="background:var(--danger);" onclick="adminDeleteListing('${data.id}')">Delete</button>` : ''}
    <button class="btn" onclick="closeModal('listingDetailModal')">Close</button>
  `;
  document.getElementById('listingDetailModal').classList.add('active');
}
async function buyListing(id) {
  const { data: listing } = await db.from('listings').select('*').eq('id', id).single();
  if(!listing || listing.status!=='active') return alert('Unavailable.');
  await db.from('orders').insert({ listing_id: id, buyer_username: me.name, seller_username: listing.seller_username, amount: listing.price_crypto, crypto_currency: listing.crypto_currency });
  await db.from('listings').update({ status: 'sold' }).eq('id', id);
  closeModal('listingDetailModal');
  alert(`Order placed! Send ${listing.price_crypto} ${listing.crypto_currency} to admin wallet.`);
  loadOrders(); loadListings();
}
async function adminDeleteListing(id) {
  if(confirm('Delete?')) { await db.from('listings').delete().eq('id', id); closeModal('listingDetailModal'); loadListings(); }
}

// Orders
async function loadOrders() {
  const { data } = await db.from('orders').select('*')
    .or(`buyer_username.eq.${me.name},seller_username.eq.${me.name}`)
    .order('created_at', { ascending: false });
  renderOrders(data || []);
}
function renderOrders(orders) {
  const container = document.getElementById('ordersList');
  if(!orders.length) { container.innerHTML = '<p style="color:#666;">No orders.</p>'; return; }
  container.innerHTML = orders.map(o => `
    <div class="order-card">
      <h3>Order #${o.id.slice(0,8)}</h3>
      <div>${o.buyer_username} → ${o.seller_username} | ${o.amount} ${o.crypto_currency}</div>
      <div>Payment: ${o.payment_status} | Delivery: ${o.delivery_status}</div>
      ${o.tracking_number ? `<div>Tracking: ${o.tracking_number}</div>` : ''}
      <div id="order-actions-${o.id}">${renderOrderActions(o)}</div>
    </div>
  `).join('');
}
function renderOrderActions(order) {
  let html = '';
  if(me.isAdmin) {
    if(order.payment_status === 'awaiting_payment') html += `<button class="btn" onclick="adminConfirmPayment('${order.id}')">Confirm Payment</button> `;
    if(order.payment_status === 'paid_to_admin') html += `<button class="btn" onclick="adminReleaseEscrow('${order.id}')">Release Escrow</button> `;
    if(order.payment_status === 'disputed') html += `<button class="btn" onclick="resolveDispute('${order.id}')">Resolve</button> `;
  }
  if(!me.isAdmin && order.seller_username === me.name) {
    if(order.delivery_status === 'not_shipped') {
      html += `<input type="text" id="track-${order.id}" placeholder="Tracking #" style="width:120px;">`;
      html += `<button class="btn" onclick="shipOrder('${order.id}')">Mark Shipped</button> `;
    }
    if(order.delivery_status === 'shipped') html += `<button class="btn" onclick="markDelivered('${order.id}')">Mark Delivered</button> `;
  }
  if(!me.isAdmin && order.buyer_username === me.name && order.delivery_status === 'delivered') {
    html += `<button class="btn" onclick="showRating('${order.id}')">Rate Seller</button> `;
  }
  html += `<button class="btn" onclick="showDispute('${order.id}')">Dispute</button>`;
  return html;
}
async function adminConfirmPayment(id) { await db.from('orders').update({ payment_status: 'paid_to_admin' }).eq('id', id); loadOrders(); }
async function adminReleaseEscrow(id) {
  const txHash = prompt('Enter TX ID for seller payout:');
  if(!txHash) return;
  const { error } = await db.rpc('complete_order', { order_uuid: id, tx_hash: txHash });
  if(error) alert('Error: '+error.message); else { alert('Escrow released.'); loadOrders(); }
}
async function shipOrder(id) {
  const tracking = document.getElementById('track-'+id).value;
  if(!tracking) return alert('Enter tracking number.');
  await db.from('orders').update({ delivery_status: 'shipped', tracking_number: tracking }).eq('id', id);
  loadOrders();
}
async function markDelivered(id) { await db.from('orders').update({ delivery_status: 'delivered' }).eq('id', id); loadOrders(); }
async function resolveDispute(id) {
  const action = prompt('Resolve as "refund" or "release":');
  if(!action) return;
  if(action === 'refund') await db.from('orders').update({ payment_status: 'refunded' }).eq('id', id);
  else await db.from('orders').update({ payment_status: 'released', delivery_status: 'delivered' }).eq('id', id);
  loadOrders();
}

// Ratings
function showRating(orderId) {
  document.getElementById('rateOrderId').textContent = orderId;
  document.getElementById('ratingModal').classList.add('active');
}
async function submitRating() {
  const orderId = document.getElementById('rateOrderId').textContent;
  const rating = parseInt(document.getElementById('rateValue').value);
  const comment = document.getElementById('rateComment').value;
  if(!rating || rating<1 || rating>5) return alert('Invalid rating.');
  const { data: order } = await db.from('orders').select('seller_username').eq('id', orderId).single();
  await db.from('ratings').insert({ order_id: orderId, buyer_username: me.name, seller_username: order.seller_username, rating, comment });
  closeModal('ratingModal');
  loadOrders();
}

// Disputes
function showDispute(orderId) {
  document.getElementById('disputeOrderId').textContent = orderId;
  document.getElementById('disputeModal').classList.add('active');
}
async function submitDispute() {
  const orderId = document.getElementById('disputeOrderId').textContent;
  const reason = document.getElementById('disputeReason').value;
  if(!reason) return alert('Describe the issue.');
  await db.from('disputes').insert({ order_id: orderId, raised_by: me.name, reason });
  await db.from('orders').update({ payment_status: 'disputed', delivery_status: 'disputed' }).eq('id', orderId);
  closeModal('disputeModal');
  loadOrders();
}

// MoonPay
function openMoonPay() {
  if(!MOONPAY_API_KEY) return alert('MoonPay not configured.');
  const moonpay = new MoonPay({ apiKey: MOONPAY_API_KEY });
  moonpay.openWidget({
    currencyCode: 'eth',
    walletAddress: prompt('Enter your wallet address:'),
    onSuccess: () => alert('Success!'),
    onError: (err) => alert('Error: '+err.message)
  });
}

// ==================== HELPERS ====================
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function previewListingImages() {
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = '';
  Array.from(document.getElementById('lImages').files).forEach(f => {
    const reader = new FileReader();
    reader.onload = e => { const img = document.createElement('img'); img.src = e.target.result; img.style.width='60px'; preview.appendChild(img); };
    reader.readAsDataURL(f);
  });
}
